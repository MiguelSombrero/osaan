name: Build & Publish Osaan System

on:
  push:
    branches: [ main ]
    paths:
      - 'microservices/osaan-core/**'
      - 'microservices/competence-matching-service/**'
      - 'microservices/competence-profile-service/**'
      - 'microservices/employee-service/**'
      - 'microservices/skill-catalog-service/**'
      - 'pom.xml'
  workflow_dispatch:

env:
  JAVA_VERSION: '25'

jobs:
  build-core:
    name: Build & Publish osaan-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and publish osaan-core
        run: |
          cd microservices/osaan-core
          mvn -B clean deploy -DskipTests

  build-and-push-services:
    name: Build & Push microservice images
    runs-on: ubuntu-latest
    needs: build-core
    if: github.event_name == 'push'
    permissions:
      contents: read
    strategy:
      matrix:
        service:
          - competence-matching-service
          - competence-profile-service
          - employee-service
          - skill-catalog-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build JAR with Maven
        run: |
          cd microservices/${{ matrix.service }}
          mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/${{ matrix.service }}
          file: ./microservices/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-${{ matrix.service }}:${{ github.sha }}