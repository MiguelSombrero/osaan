name: Build & Publish Osaan System

on:
  push:
    branches: [ main ]
    paths:
      - 'microservices/osaan-core/**'
      - 'microservices/competence-matching-service/**'
      - 'microservices/competence-profile-service/**'
      - 'microservices/employee-service/**'
      - 'microservices/skill-catalog-service/**'
      - 'pom.xml'
      - 'ui/osaan-admin-ui/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '25'

jobs:
  detect-changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.detect.outputs.core_changed }}
      changed_services: ${{ steps.detect.outputs.changed_services }}
      admin_backend_changed: ${{ steps.detect.outputs.admin_backend_changed }}
      admin_frontend_changed: ${{ steps.detect.outputs.admin_frontend_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: detect
        run: |
          echo "Detecting changes between ${{ github.event.before }} and ${{ github.sha }}"

          # Fallback for non-push events (e.g. workflow_dispatch): treat as "no filtering"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "${{ github.event.before }}" ]; then
            CORE_CHANGED=true
            SERVICES_JSON='["competence-matching-service","competence-profile-service","employee-service","skill-catalog-service"]'
            ADMIN_BACKEND_CHANGED=true
            ADMIN_FRONTEND_CHANGED=true
            printf 'core_changed=%s\n' "$CORE_CHANGED" >> "$GITHUB_OUTPUT"
            printf 'changed_services=%s\n' "$SERVICES_JSON" >> "$GITHUB_OUTPUT"
            printf 'admin_backend_changed=%s\n' "$ADMIN_BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
            printf 'admin_frontend_changed=%s\n' "$ADMIN_FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)"

          CORE_CHANGED=false
          if echo "$CHANGED_FILES" | grep -qE '^microservices/osaan-core/|^pom.xml'; then
            CORE_CHANGED=true
          fi

          SERVICES_JSON='[]'
          SERVICES=$(echo "$CHANGED_FILES" \
            | grep -oE '^microservices/[^/]+/' \
            | cut -d'/' -f2 \
            | sort -u \
            | grep -v 'osaan-core' || true)

          for SVC in $SERVICES; do
            SERVICES_JSON=$(echo "$SERVICES_JSON" | jq -c --arg svc "$SVC" '. + [$svc]')
          done

          # Ensure compact single-line JSON
          SERVICES_JSON=$(echo "$SERVICES_JSON" | jq -c '.')

          ADMIN_BACKEND_CHANGED=false
          if echo "$CHANGED_FILES" | grep -qE '^ui/osaan-admin-ui/backend/'; then
            ADMIN_BACKEND_CHANGED=true
          fi

          ADMIN_FRONTEND_CHANGED=false
          if echo "$CHANGED_FILES" | grep -qE '^ui/osaan-admin-ui/frontend/'; then
            ADMIN_FRONTEND_CHANGED=true
          fi

          printf 'core_changed=%s\n' "$CORE_CHANGED" >> "$GITHUB_OUTPUT"
          printf 'changed_services=%s\n' "$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          printf 'admin_backend_changed=%s\n' "$ADMIN_BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
          printf 'admin_frontend_changed=%s\n' "$ADMIN_FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"

  build-core:
    name: Build & Publish osaan-core
    runs-on: ubuntu-latest
    needs: detect-changes
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and publish osaan-core
        run: |
          cd microservices/osaan-core
          mvn -B clean deploy -DskipTests

  build-and-push-services:
    name: Build & Push microservice images
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-core
    if: needs.detect-changes.outputs.changed_services != '[]'
    permissions:
      contents: read
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.changed_services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build JAR with Maven
        run: |
          cd microservices/${{ matrix.service }}
          mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/${{ matrix.service }}
          file: ./microservices/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-${{ matrix.service }}:${{ github.sha }}

  build-and-push-admin-ui:
    name: Build & Push admin UI images
    runs-on: ubuntu-latest
    needs:
      - detect-changes
    if: >
      needs.detect-changes.outputs.admin_backend_changed == 'true' ||
      needs.detect-changes.outputs.admin_frontend_changed == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push admin UI backend image
        if: needs.detect-changes.outputs.admin_backend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./ui/osaan-admin-ui/backend
          file: ./ui/osaan-admin-ui/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-admin-ui-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-admin-ui-backend:${{ github.sha }}

      - name: Build and push admin UI frontend image
        if: needs.detect-changes.outputs.admin_frontend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./ui/osaan-admin-ui/frontend
          file: ./ui/osaan-admin-ui/frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-admin-ui-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-admin-ui-frontend:${{ github.sha }}