name: Build & Publish Osaan System

on:
  push:
    branches: [dev]
    paths:
      - "microservices/osaan-core/**"
      - "microservices/competence-matching-service/**"
      - "microservices/competence-profile-service/**"
      - "microservices/employee-service/**"
      - "microservices/skill-catalog-service/**"
      - "pom.xml"
      - "ui/osaan-admin-ui/**"
      - "ui/osaan-ui/**"
  workflow_dispatch:

env:
  JAVA_VERSION: "25"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect-changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.detect.outputs.core_changed }}
      changed_services: ${{ steps.detect.outputs.changed_services }}
      admin_backend_changed: ${{ steps.detect.outputs.admin_backend_changed }}
      admin_frontend_changed: ${{ steps.detect.outputs.admin_frontend_changed }}
      osaan_ui_changed: ${{ steps.detect.outputs.osaan_ui_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: detect
        run: |
          echo "Detecting changes between ${{ github.event.before }} and ${{ github.sha }}"

          # Fallback for non-push events (e.g. workflow_dispatch): treat as "no filtering"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "${{ github.event.before }}" ]; then
            CORE_CHANGED=true
            SERVICES_JSON='["competence-matching-service","competence-profile-service","employee-service","skill-catalog-service"]'
            ADMIN_BACKEND_CHANGED=true
            ADMIN_FRONTEND_CHANGED=true
            OSAAN_UI_CHANGED=true
            printf 'core_changed=%s\n' "$CORE_CHANGED" >> "$GITHUB_OUTPUT"
            printf 'changed_services=%s\n' "$SERVICES_JSON" >> "$GITHUB_OUTPUT"
            printf 'admin_backend_changed=%s\n' "$ADMIN_BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
            printf 'admin_frontend_changed=%s\n' "$ADMIN_FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"
            printf 'osaan_ui_changed=%s\n' "$OSAAN_UI_CHANGED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)"

          CORE_CHANGED=false
          if echo "$CHANGED_FILES" | grep -qE '^microservices/osaan-core/|^pom.xml'; then
            CORE_CHANGED=true
          fi

          SERVICES_JSON='[]'
          SERVICES=$(echo "$CHANGED_FILES" \
            | grep -oE '^microservices/[^/]+/' \
            | cut -d'/' -f2 \
            | sort -u \
            | grep -v 'osaan-core' || true)

          for SVC in $SERVICES; do
            SERVICES_JSON=$(echo "$SERVICES_JSON" | jq -c --arg svc "$SVC" '. + [$svc]')
          done

          # Ensure compact single-line JSON
          SERVICES_JSON=$(echo "$SERVICES_JSON" | jq -c '.')

          ADMIN_BACKEND_CHANGED=false
          if echo "$CHANGED_FILES" | grep -qE '^ui/osaan-admin-ui/backend/'; then
            ADMIN_BACKEND_CHANGED=true
          fi

          ADMIN_FRONTEND_CHANGED=false
          if echo "$CHANGED_FILES" | grep -qE '^ui/osaan-admin-ui/frontend/'; then
            ADMIN_FRONTEND_CHANGED=true
          fi

          OSAAN_UI_CHANGED=false
          if echo "$CHANGED_FILES" | grep -qE '^ui/osaan-ui/'; then
            OSAAN_UI_CHANGED=true
          fi

          printf 'core_changed=%s\n' "$CORE_CHANGED" >> "$GITHUB_OUTPUT"
          printf 'changed_services=%s\n' "$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          printf 'admin_backend_changed=%s\n' "$ADMIN_BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
          printf 'admin_frontend_changed=%s\n' "$ADMIN_FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"
          printf 'osaan_ui_changed=%s\n' "$OSAAN_UI_CHANGED" >> "$GITHUB_OUTPUT"

  build-core:
    name: Build & Publish osaan-core
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.core_changed == 'true'
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and publish osaan-core
        run: |
          cd microservices/osaan-core
          mvn -B clean deploy -DskipTests

  build-and-push-services:
    name: Build & Push microservice images
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-core
    if: >
      always() &&
      needs.detect-changes.outputs.changed_services != '[]' &&
      (
        needs.detect-changes.outputs.core_changed != 'true' ||
        needs.build-core.result == 'success'
      )
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.changed_services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build JAR with Maven
        run: |
          cd microservices/${{ matrix.service }}
          mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/${{ matrix.service }}
          file: ./microservices/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-${{ matrix.service }}:${{ github.sha }}

  build-and-push-admin-ui:
    name: Build & Push admin UI images
    runs-on: ubuntu-latest
    needs:
      - detect-changes
    if: >
      needs.detect-changes.outputs.admin_backend_changed == 'true' ||
      needs.detect-changes.outputs.admin_frontend_changed == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push admin UI backend image
        if: needs.detect-changes.outputs.admin_backend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./ui/osaan-admin-ui/backend
          file: ./ui/osaan-admin-ui/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-admin-ui-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-admin-ui-backend:${{ github.sha }}

      - name: Generate API client for frontend
        if: needs.detect-changes.outputs.admin_frontend_changed == 'true'
        working-directory: ./ui/osaan-admin-ui/frontend
        run: npm run generate:client

      - name: Build and push admin UI frontend image
        if: needs.detect-changes.outputs.admin_frontend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./ui/osaan-admin-ui/frontend
          file: ./ui/osaan-admin-ui/frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-admin-ui-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-admin-ui-frontend:${{ github.sha }}

  build-and-push-osaan-ui:
    name: Build & Push osaan-ui image
    runs-on: ubuntu-latest
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.osaan_ui_changed == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push osaan-ui image
        uses: docker/build-push-action@v6
        with:
          context: ./ui/osaan-ui
          file: ./ui/osaan-ui/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/osaan-ui:${{ github.sha }}

  update-kustomize-images:
    name: Update kustomization image tags
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-and-push-services
      - build-and-push-admin-ui
      - build-and-push-osaan-ui
    if: >
      always() &&
      (
        needs.detect-changes.outputs.changed_services != '[]' ||
        needs.detect-changes.outputs.admin_backend_changed == 'true' ||
        needs.detect-changes.outputs.admin_frontend_changed == 'true' ||
        needs.detect-changes.outputs.osaan_ui_changed == 'true'
      )
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Update microservice image tags in kustomization.yaml
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changed_services }}
          GIT_SHA: ${{ github.sha }}
        run: |
          echo "Changed services: $CHANGED_SERVICES"
          for svc in $(echo "$CHANGED_SERVICES" | jq -r '.[]'); do
            IMAGE_BASE="miguelsombrero/osaan-${svc}"
            echo "Updating $IMAGE_BASE to tag $GIT_SHA"
            yq -i "
              (.images[] | select(.name == \"$IMAGE_BASE\") | .newTag) = \"$GIT_SHA\"
            " kustomization.yaml
          done

      - name: Update admin backend/frontend image tags in kustomization.yaml
        env:
          GIT_SHA: ${{ github.sha }}
          ADMIN_BACKEND_CHANGED: ${{ needs.detect-changes.outputs.admin_backend_changed }}
          ADMIN_FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.admin_frontend_changed }}
        run: |
          if [ "$ADMIN_BACKEND_CHANGED" = "true" ]; then
            yq -i '
              (.images[] | select(.name == "miguelsombrero/osaan-admin-ui-backend") | .newTag) = env(GIT_SHA)
            ' kustomization.yaml
          fi

          if [ "$ADMIN_FRONTEND_CHANGED" = "true" ]; then
            yq -i '
              (.images[] | select(.name == "miguelsombrero/osaan-admin-ui-frontend") | .newTag) = env(GIT_SHA)
            ' kustomization.yaml
          fi

      - name: Update osaan-ui image tag in kustomization.yaml
        env:
          GIT_SHA: ${{ github.sha }}
          OSAAN_UI_CHANGED: ${{ needs.detect-changes.outputs.osaan_ui_changed }}
        run: |
          if [ "$OSAAN_UI_CHANGED" = "true" ]; then
            yq -i '
              (.images[] | select(.name == "miguelsombrero/osaan-ui") | .newTag) = env(GIT_SHA)
            ' kustomization.yaml
          fi

      - name: Commit and push kustomization changes
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add kustomization.yaml
          git commit -m "chore: update kustomization images for $GIT_SHA"
          git push
