name: Build & Publish Osaan System

on:
  push:
    branches: [ main ]
    paths:
      - 'microservices/osaan-core/**'
      - 'pom.xml'
  workflow_dispatch:

env:
  JAVA_VERSION: '25'

jobs:
  build-core:
    name: Build & Publish osaan-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and publish osaan-core
        run: |
          cd microservices/osaan-core
          mvn -B clean deploy -DskipTests
