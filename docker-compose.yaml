# Shared infrastructure for running services in an IDE and UIs with
# `npm run dev`. The applications themselves run in k3d, the only full-stack
# runtime. k3d's versions are the source of truth:
# scripts/check-compose-versions.mjs fails when a tag here differs.
services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: osaan-mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    environment:
      - MH_STORAGE=maildir
      - MH_MAILDIR_PATH=/maildir
    volumes:
      - ./maildir:/maildir

  rabbitmq:
    image: rabbitmq:4.3.4-management
    container_name: osaan-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: osaan-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/certs/cert.pem
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/certs/key.pem
      # No fixed hostname: the issuer follows the request, https://localhost:8443
      - KC_HOSTNAME_STRICT=false
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
      - ./keycloak/certs:/opt/keycloak/certs:ro
    ports:
      - "8443:8443"

  # One DB for all microservices for simplicity in development
  osaan-db:
    image: postgres:17.11-alpine
    container_name: osaan-db
    restart: always
    environment:
      POSTGRES_PASSWORD: osaan_pass
    ports:
      - "5432:5432"
    volumes:
      # Where PostgreSQL 17 keeps its data; 18 moves it to /var/lib/postgresql.
      - osaan-db-data:/var/lib/postgresql/data

  osaan-valkey:
    image: valkey/valkey:9.0.2-alpine
    container_name: osaan-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data

volumes:
  osaan-db-data:
  valkey-data:
