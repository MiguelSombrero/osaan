services:
  mailhog:
    image: mailhog/mailhog
    container_name: osaan-mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    environment:
      - MH_STORAGE=maildir
      - MH_MAILDIR_PATH=/maildir
    volumes:
      - ./maildir:/maildir

  rabbitmq:
    image: rabbitmq:4-management
    container_name: osaan-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: osaan-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/certs/cert.pem
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/certs/key.pem
      - KC_HOSTNAME=keycloak
      - KC_HOSTNAME_STRICT=false
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
      - ./keycloak/certs:/opt/keycloak/certs:ro
    ports:
      - "8443:8443"

  # One DB for all microservices for simplicity in development
  osaan-db:
    image: postgres:18.0-alpine
    container_name: osaan-db
    restart: always
    environment:
      POSTGRES_PASSWORD: osaan_pass
    ports:
      - "5432:5432"
    volumes:
      - osaan-data:/var/lib/postgresql

  zipkin-server:
    image: openzipkin/zipkin:2.24.0
    restart: always
    mem_limit: 1024m
    environment:
      - STORAGE_TYPE=mem
    ports:
      - 9411:9411

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      #- GF_ALERTING_ENABLED=true
      #- GF_UNIFIED_ALERTING_ENABLED=false
      - GF_SMTP_ENABLED=true
      - GF_SMTP_SKIP_VERIFY=true
      - GF_SMTP_HOST=mailhog:1025
      - GF_SMTP_FROM_ADDRESS=grafana@osaan.com
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  osaan-redis:
    image: redis:8-alpine
    container_name: osaan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # -----------------
  # Microservices
  # -----------------
  employee-service:
    build: ./microservices/employee-service
    container_name: employee-service
    depends_on:
      - osaan-db
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8091:8080"
      - "4001:4004"

  skill-catalog-service:
    build: ./microservices/skill-catalog-service
    container_name: skill-catalog-service
    depends_on:
      - osaan-db
      - keycloak
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: >
        -Djavax.net.ssl.trustStore=/opt/java/keycloak-truststore.jks
        -Djavax.net.ssl.trustStorePassword=changeit
    ports:
      - "8092:8080"
      - "4002:4004"
    volumes:
      - ./keycloak/certs/keycloak-truststore.jks:/opt/java/keycloak-truststore.jks:ro

  competence-profile-service:
    build: ./microservices/competence-profile-service
    container_name: competence-profile-service
    depends_on:
      - osaan-db
      - rabbitmq
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8093:8080"
      - "4003:4004"

  competence-matching-service:
    build: ./microservices/competence-matching-service
    container_name: competence-matching-service
    depends_on:
      - osaan-db
      - mailhog
      - rabbitmq
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8094:8080"
      - "4004:4004"

  osaan-admin-backend:
    build: ./ui/osaan-admin-ui/backend
    container_name: osaan-admin-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=staging
    depends_on:
      - osaan-redis
      - keycloak

  osaan-admin-ui:
    build: ./ui/osaan-admin-ui/frontend
    container_name: osaan-admin-ui
    ports:
      - "8085:80"
    environment:
      - API_URL=http://osaan-admin-backend:3001
    depends_on:
      - osaan-admin-backend

  osaan-ui:
    build: ./ui/osaan-ui
    container_name: osaan-ui
    ports:
      - "3002:3000"
    env_file:
      - ./ui/osaan-ui/.env.staging
    depends_on:
      - skill-catalog-service
      - competence-profile-service
      - employee-service
      - keycloak
      - osaan-redis

volumes:
  osaan-data:
  redis-data:
