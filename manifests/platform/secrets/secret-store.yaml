apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-sa
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-secret-reader
  namespace: osaan-dev
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["osaan-db-pguser-keycloakuser"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-secret-reader
  namespace: osaan-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-secret-reader
subjects:
- kind: ServiceAccount
  name: eso-sa
  namespace: keycloak
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: osaan-postgres-store
  namespace: keycloak
spec:
  provider:
    kubernetes:
      remoteNamespace: osaan-dev
      auth:
        serviceAccount:
          name: eso-sa
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt