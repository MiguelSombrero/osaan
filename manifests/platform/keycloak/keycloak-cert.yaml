apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-cert
  namespace: keycloak
spec:
  secretName: keycloak-tls
  commonName: keycloak.local
  dnsNames:
    - keycloak.local
    - osaan-keycloak-service.keycloak.svc.cluster.local
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
