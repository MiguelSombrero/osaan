apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: osaan-keycloak
  namespace: keycloak
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-postgres-svc.keycloak.svc.cluster.local
    port: 5432
    usernameSecret:
      name: keycloak-postgres-secret
      key: POSTGRES_USER
    passwordSecret:
      name: keycloak-postgres-secret
      key: POSTGRES_PASSWORD
    database: keycloak
  hostname:
    hostname: https://keycloak.local:9443
    admin: https://keycloak.local:9443
    strict: false
    backchannelDynamic: true
  http:
    httpEnabled: true
    httpPort: 8080
  proxy:
    headers: xforwarded