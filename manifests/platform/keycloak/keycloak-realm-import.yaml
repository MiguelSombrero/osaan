apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: osaan-realm
  namespace: keycloak
spec:
  keycloakCRName: osaan-keycloak
  realm:
    id: osaan
    realm: osaan
    displayName: Osaan
    enabled: true
    roles:
      realm:
        - name: ADMIN
          description: Administrator role for Osaan
        - name: MANAGER
          description: Manager or project leader role for Osaan
        - name: USER
          description: Regular user role for Osaan
    clients:
      - clientId: osaan-ui
        name: Osaan UI
        secret: osaan-secret
        enabled: true
        protocol: openid-connect
        redirectUris:
          - https://osaan.local/*
          - https://osaan.local:9443/*
        webOrigins:
          - https://osaan.local
          - https://osaan.local:9443
        publicClient: false
        bearerOnly: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        attributes:
          post.logout.redirect.uris: >-
            https://osaan.local/*##https://osaan.local:9443/*##
      - clientId: osaan-admin-ui
        name: Osaan Admin UI
        secret: osaan-admin-secret
        enabled: true
        protocol: openid-connect
        redirectUris:
          - https://osaan.admin.local/*
          - https://osaan.admin.local:9443/*
        webOrigins:
          - https://osaan.admin.local
          - https://osaan.admin.local:9443
        publicClient: false
        bearerOnly: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        attributes:
          post.logout.redirect.uris: >-
            https://osaan.admin.local/*##https://osaan.admin.local:9443/*##
    users:
      - id: a1b2c3d4-0001-4000-a000-000000000001
        username: anna
        enabled: true
        emailVerified: true
        firstName: Anna
        lastName: Korhonen
        email: anna.korhonen@example.com
        credentials:
          - type: password
            value: anna
            temporary: false
        requiredActions: []
        realmRoles:
          - ADMIN

