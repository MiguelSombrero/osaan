apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: osaan-realm
  namespace: keycloak
spec:
  keycloakCRName: osaan-keycloak
  realm:
    id: osaan
    realm: osaan
    displayName: Osaan
    enabled: true
    roles:
      realm:
        - name: ADMIN
          description: Administrator role for Osaan
        - name: MANAGER
          description: Manager or project leader role for Osaan
        - name: USER
          description: Regular user role for Osaan
    clients:
      - clientId: osaan-ui
        name: Osaan UI
        secret: osaan-secret
        enabled: true
        protocol: openid-connect
        redirectUris:
          - https://osaan.local/*
          - https://osaan.local:9443/*
        webOrigins:
          - https://osaan.local
          - https://osaan.local:9443
        publicClient: false
        bearerOnly: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        attributes:
          post.logout.redirect.uris: >-
            https://osaan.local/*##https://osaan.local:9443/*##
      - clientId: osaan-admin-ui
        name: Osaan Admin UI
        secret: osaan-admin-secret
        enabled: true
        protocol: openid-connect
        redirectUris:
          - https://osaan.admin.local/*
          - https://osaan.admin.local:9443/*
        webOrigins:
          - https://osaan.admin.local
          - https://osaan.admin.local:9443
        publicClient: false
        bearerOnly: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        attributes:
          post.logout.redirect.uris: >-
            https://osaan.admin.local/*##https://osaan.admin.local:9443/*##
    users:
      - id: a1b2c3d4-0001-4000-a000-000000000001
        username: anna
        enabled: true
        emailVerified: true
        firstName: Anna
        lastName: Korhonen
        email: anna.korhonen@example.com
        credentials:
          - type: password
            value: anna
            temporary: false
        requiredActions: []
        realmRoles:
          - ADMIN

      - id: a1b2c3d4-0002-4000-a000-000000000002
        username: mikko
        enabled: true
        emailVerified: true
        firstName: Mikko
        lastName: Virtanen
        email: mikko.virtanen@example.com
        credentials:
          - type: password
            value: mikko
            temporary: false
        requiredActions: []
        realmRoles:
          - MANAGER
          - USER

      - id: a1b2c3d4-0003-4000-a000-000000000003
        username: liisa
        enabled: true
        emailVerified: true
        firstName: Liisa
        lastName: Laine
        email: liisa.laine@example.com
        credentials:
          - type: password
            value: liisa
            temporary: false
        requiredActions: []
        realmRoles:
          - USER

      - id: a1b2c3d4-0004-4000-a000-000000000004
        username: jari
        enabled: true
        emailVerified: true
        firstName: Jari
        lastName: Mäkinen
        email: jari.makinen@example.com
        credentials:
          - type: password
            value: jari
            temporary: false
        requiredActions: []
        realmRoles:
          - USER

      - id: a1b2c3d4-0005-4000-a000-000000000005
        username: sari
        enabled: true
        emailVerified: true
        firstName: Sari
        lastName: Niemi
        email: sari.niemi@example.com
        credentials:
          - type: password
            value: sari
            temporary: false
