apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: osaan-realm
  namespace: keycloak
spec:
  keycloakCRName: osaan-keycloak
  realm:
    id: osaan
    realm: osaan
    displayName: Osaan
    enabled: true
    roles:
      realm:
        - name: ADMIN
          description: Administrator role for Osaan
        - name: MANAGER
          description: Manager or project leader role for Osaan
        - name: USER
          description: Regular user role for Osaan
    clients:
      - clientId: osaan-admin-ui
        name: Osaan Admin UI
        secret: osaan-admin-secret
        enabled: true
        protocol: openid-connect
        redirectUris:
          - https://osaan.admin.local/*
          - https://osaan.admin.local:9443/*
        webOrigins:
          - https://osaan.admin.local
          - https://osaan.admin.local:9443
        publicClient: false
        bearerOnly: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        attributes:
          post.logout.redirect.uris: >-
            https://osaan.admin.local/*##https://osaan.admin.local:9443/*##
    users:
      - username: admin
        enabled: true
        emailVerified: true
        firstName: Admin
        lastName: User
        email: admin@example.com
        credentials:
          - type: password
            value: admin
            temporary: false
        requiredActions: []
        realmRoles:
          - ADMIN

      - username: user
        enabled: true
        emailVerified: true
        firstName: Regular
        lastName: User
        email: user@example.com
        credentials:
          - type: password
            value: user
            temporary: false
        requiredActions: []
        realmRoles:
          - USER