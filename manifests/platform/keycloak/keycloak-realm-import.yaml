apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: osaan-realm
  namespace: keycloak
spec:
  keycloakCRName: osaan-keycloak
  realm:
    id: osaan
    realm: osaan
    displayName: Osaan
    enabled: true
    clients:
      - clientId: osaan-admin-ui
        name: Osaan Admin UI
        secret: osaan-admin-secret
        enabled: true
        protocol: openid-connect
        redirectUris:
          - https://keycloak.local:9443/*
          - http://osaan.admin.local:9080/*
        webOrigins:
          - https://keycloak.local:9443/*
          - http://osaan.admin.local:9080/*
          - http://osaan-admin-backend-svc:80
        publicClient: false
        bearerOnly: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        attributes:
          post.logout.redirect.uris: >-
            http://osaan.admin.local:9080/*##
            https://keycloak.local:9443/*
    users:
      - username: admin
        enabled: true
        emailVerified: true
        firstName: Admin
        lastName: User
        email: admin@example.com
        credentials:
          - type: password
            value: admin
            temporary: false
        requiredActions: []