apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: osaan-db
  namespace: osaan-dev
  annotations:
    postgres-operator.crunchydata.com/autoCreateUserSchema: "true"
spec:
  postgresVersion: 17
  # Pinned, with docker-compose.yaml following: the operator no longer chooses it.
  image: registry.developers.crunchydata.com/crunchydata/crunchy-postgres:ubi9-17.11-2633
  users:
    - name: osaan-user
      databases:
        - osaan-db # one DB for all microservices in development for simplicity
    - name: keycloakuser
      databases:
        - keycloakdb 
  instances:
    - name: instance1
      dataVolumeClaimSpec:
        accessModes:
        - "ReadWriteOnce"
        resources:
          requests:
            storage: 1Gi
  backups:
    pgbackrest:
      repos:
      - name: repo1
        volume:
          volumeClaimSpec:
            accessModes:
            - "ReadWriteOnce"
            resources:
              requests:
                storage: 1Gi