apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: osaan-operators
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MiguelSombrero/osaan.git
    targetRevision: dev
    path: manifests/platform/operators
  directory:
    recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: operators
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true