apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: osaan-certificate
  namespace: istio-system
spec:
  commonName: local
  dnsNames:
    - keycloak.local
    - osaan.admin.local
    - osaan.local
    - grafana.local
    - mail.local
    - kiali.local
    - prometheus.local
    - rabbit.local
    - jaeger.local
    - argocd.local
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  secretName: osaan-certificate
