apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-catalog-service-dep
  namespace: osaan-dev
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4004"
    prometheus.io/scheme: http
    prometheus.io/path: "/actuator/prometheus"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skill-catalog-service
  template:
    metadata:
      labels:
        app: skill-catalog-service
    spec:
      containers:
        - name: skill-catalog-service
          image: miguelsombrero/skill-catalog-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: skill-catalog-service-config
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
