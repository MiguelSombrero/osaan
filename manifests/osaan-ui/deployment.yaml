apiVersion: apps/v1
kind: Deployment
metadata:
  name: osaan-ui-dep
  namespace: osaan-dev
  #annotations:
  #  prometheus.io/scrape: "true"
  #  prometheus.io/port: "4004"
  #  prometheus.io/scheme: http
  #  prometheus.io/path: "/actuator/prometheus"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: osaan-ui
  template:
    metadata:
      labels:
        app: osaan-ui
    spec:
      containers:
        - name: osaan-ui
          image: miguelsombrero/osaan-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: osaan-ui-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
