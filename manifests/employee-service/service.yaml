apiVersion: v1
kind: Service
metadata:
  name: employee-svc
  namespace: osaan-dev
spec:
  selector:
    app: employee-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
    - name: management
      protocol: TCP
      port: 4004
      targetPort: 4004
  type: ClusterIP
