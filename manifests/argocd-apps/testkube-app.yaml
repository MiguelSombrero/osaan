apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-testkube
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/MiguelSombrero/osaan.git
    targetRevision: dev
    path: manifests/testkube
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: testkube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true