apiVersion: tests.testkube.io/v1
kind: TestTrigger
metadata:
  name: osaan-dev-deployment-trigger
  namespace: testkube
spec:
  resource: deployment
  resourceSelector:
    namespace: osaan-dev
    nameRegex: ".*"
  event: deployment-image-update
  action: run
  execution: testworkflow
  testSelector:
    name: osaan-ui-e2e
    namespace: testkube
  concurrencyPolicy: replace
  delay: "30s"
