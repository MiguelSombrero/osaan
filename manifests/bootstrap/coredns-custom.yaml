# k3s CoreDNS override, applied by setup-cluster.sh: resolves the gateway
# hosts that sign-in redirects use to the Istio ingress gateway for every pod,
# as /etc/hosts does on the host. Meshed pods resolve keycloak.local through
# Istio DNS capture instead; pods outside the mesh (Testkube runners) need
# this to follow the sign-in flow through the same URLs a browser uses.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  gateway-hosts.override: |
    rewrite name exact keycloak.local istio-ingressgateway.istio-system.svc.cluster.local answer auto
    rewrite name exact osaan.local istio-ingressgateway.istio-system.svc.cluster.local answer auto
    rewrite name exact osaan.admin.local istio-ingressgateway.istio-system.svc.cluster.local answer auto
