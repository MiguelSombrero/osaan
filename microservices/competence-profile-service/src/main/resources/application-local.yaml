employee:
  service:
    url: http://localhost:8091

skill:
  service:
    url: http://localhost:8092

logging:
  level:
    io:
      github:
        resilience4j: TRACE
    org.springframework.web.client.RestClient: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.resilience: TRACE
    web: TRACE

management:
  health.circuitbreakers.enabled: true
  endpoint.health.show-details: "ALWAYS"
  endpoints.web.exposure.include: "*"
  zipkin.tracing.endpoint: http://zipkin-server:9411/api/v2/spans
  tracing.sampling.probability: 1.0

server:
  port: 8093

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest # Default RabbitMQ credentials for local development