api:
  version: 1.0.0
  title: Competence Service API
  description: API for managing competences
  license:
    name: MIT
    url: https://raw.githubusercontent.com/MiguelSombrero/osaan/refs/heads/main/LICENSE?token=GHSAT0AAAAAADI246M5X7R6KOEGQGCQX3GY2HJDVBA
  contact:
    name: Miguel Sombrero
  security:
    oauth2:
      authorizationUrl: ${ISSUER_URI:https://keycloak.local/realms/osaan}/protocol/openid-connect/auth
      tokenUrl: ${ISSUER_URI:https://keycloak.local/realms/osaan}/protocol/openid-connect/token
      scopes:
        read: Grants read access
        write: Grants write access

app:
  auth:
    disabled: ${APP_AUTH_DISABLED:false}

logging:
  level:
    com.github.miguelsombrero.osaan: ${LOGGING_LEVEL_APPLICATION:INFO}

management:
  server.port: 4004
  endpoint.health.show-details: "ALWAYS"
  endpoints.web.exposure.include: "*"
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
  health.rabbit.enabled: true
  health.circuitbreakers.enabled: true
  zipkin.tracing.endpoint: ${TRACING_ENDPOINT:http://zipkin-server:9411/api/v2/spans}
  tracing.sampling.probability: ${SAMPLING_PROBABILITY:1.0}

spring:
  application:
    name: competence-profile-service
  cloud:
    stream:
      bindings:
        skillCreated-out-0:
          destination: skill.created.queue
    refresh:
      enabled: false # Compatibility issues with Spring Boot 4.0.0-SNAPSHOT
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:https://keycloak.local/realms/osaan}
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 10000        # 10s to get connection from pool
      validation-timeout: 5000         # 5s to validate connection
      max-lifetime: 600000             # 10min max connection lifetime
      idle-timeout: 300000             # 5min idle before eviction
      keepalive-time: 60000            # 60s TCP keepalive to detect stale connections
      minimum-idle: 2                  # Keep 2 connections ready
      maximum-pool-size: 10            # Max 10 connections
  sql:
    init:
      mode: always

resilience4j.timelimiter:
  instances:
    competence:
      timeoutDuration: 2s

resilience4j.retry:
  configs:
    default:
      maxAttempts: 3
      waitDuration: 1s
      retryExceptions:
        - org.springframework.web.client.HttpServerErrorException$InternalServerError
  instances:
    competence:
      baseConfig: default

resilience4j.circuitbreaker:
  configs:
    default:
      allowHealthIndicatorToFail: false
      registerHealthIndicator: true
      slidingWindowSize: 5
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      recordExceptions:
        - org.springframework.web.client.HttpServerErrorException$InternalServerError
      ignoreExceptions:
        - com.github.miguelsombrero.osaan.core.exception.ResourceNotFoundException
        - org.springframework.web.client.HttpClientErrorException$NotFound
  instances:
    competence:
      baseConfig: default

