management:
  server.port: 4004
  endpoint.health.show-details: "ALWAYS"
  endpoints.web.exposure.include: "*"
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
  health.rabbit.enabled: true
  health.circuitbreakers.enabled: true

spring:
  application:
    name: competence-profile-service
  cloud:
    stream:
      bindings:
        skillCreated-out-0:
          destination: skill.created.queue
    refresh:
      enabled: false # Compatibility issues with Spring Boot 4.0.0-SNAPSHOT
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST}:5432/${POSTGRESQL_DATABASE}
    username: ${POSTGRESQL_USER}
    password: ${POSTGRESQL_PASSWORD}
  sql:
    init:
      mode: always

resilience4j.timelimiter:
  instances:
    competence:
      timeoutDuration: 2s

resilience4j.retry:
  configs:
    default:
      maxAttempts: 3
      waitDuration: 1s
      retryExceptions:
        - org.springframework.web.client.HttpServerErrorException$InternalServerError
  instances:
    competence:
      baseConfig: default

resilience4j.circuitbreaker:
  configs:
    default:
      allowHealthIndicatorToFail: false
      registerHealthIndicator: true
      slidingWindowSize: 5
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      recordExceptions:
        - org.springframework.web.client.HttpServerErrorException$InternalServerError
      ignoreExceptions:
        - com.github.miguelsombrero.osaan.core.exception.ResourceNotFoundException
        - org.springframework.web.client.HttpClientErrorException$NotFound
  instances:
    competence:
      baseConfig: default

