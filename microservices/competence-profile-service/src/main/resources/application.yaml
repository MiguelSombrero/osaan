server:
  port: ${PORT}

spring:
  application:
    name: competence-profile-service
  cloud:
    refresh:
      enabled: false # Compatibility issues with Spring Boot 4.0.0-SNAPSHOT
  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST}:5432/postgres"
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      mode: always