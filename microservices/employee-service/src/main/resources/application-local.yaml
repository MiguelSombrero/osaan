logging:
  level:
    org:
      hibernate:
        stat: DEBUG
        SQL: DEBUG
      springframework:
        jdbc: DEBUG
    web: DEBUG

management:
  zipkin.tracing.endpoint: http://localhost:9411/api/v2/spans
  tracing.sampling.probability: 1.0

server:
  port: 8091

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true