spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

logging:
  level:
    com.github.miguelsombrero.osaan: TRACE
    com.github.miguelsombrero.osaan.skill_catalog_service.infrastructure.cache: DEBUG
    com.github.benmanes.caffeine: DEBUG
    org.springframework.cache: DEBUG
    org.springframework:
      jdbc: DEBUG
      security: DEBUG
    web: DEBUG

management:
  server.port: 4002
  tracing.export.zipkin.endpoint: http://localhost:9411/api/v2/spans
  tracing.sampling.probability: 1.0

server:
  port: 8092

APP_AUTH_DISABLED: true
API_DOCS_ENABLED: true
SWAGGER_UI_ENABLED: true
CACHE_TYPE: caffeine