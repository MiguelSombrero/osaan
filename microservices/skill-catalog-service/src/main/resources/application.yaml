api:
  version: 1.0.0
  title: Skill Catalog Service API
  description: API for managing skills
  license:
    name: MIT
    url: https://raw.githubusercontent.com/MiguelSombrero/osaan/refs/heads/main/LICENSE?token=GHSAT0AAAAAADI246M5X7R6KOEGQGCQX3GY2HJDVBA
  contact:
    name: Miguel Sombrero
  security:
    oauth2:
      authorizationUrl: ${ISSUER_URI:https://keycloak.local/realms/osaan}/protocol/openid-connect/auth
      tokenUrl: ${ISSUER_URI:https://keycloak.local/realms/osaan}/protocol/openid-connect/token
      scopes:
        read: Grants read access
        write: Grants write access

app:
  auth:
    disabled: ${APP_AUTH_DISABLED:false}

logging:
  level:
    com.github.miguelsombrero.osaan: ${LOGGING_LEVEL_APPLICATION:INFO}

management:
  server.port: 4004
  endpoint.health.show-details: "ALWAYS"
  endpoints.web.exposure.include: "*"
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
  zipkin.tracing.endpoint: ${TRACING_ENDPOINT:http://zipkin-server:9411/api/v2/spans}
  tracing.sampling.probability: ${SAMPLING_PROBABILITY:1.0}

spring:
  application:
    name: skill-catalog-service
  cloud:
    refresh:
      enabled: false # Compatibility issues with Spring Boot 4.0.0-SNAPSHOT
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:https://keycloak.local/realms/osaan}
  sql:
    init:
      mode: always