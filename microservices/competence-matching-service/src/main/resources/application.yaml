spring:
  application:
    name: competence-matching-service
  cloud:
    stream:
      bindings:
        skillCreated-in-0:
          destination: skill.created.queue
          group: competence-matching-service
      rabbit:
        bindings:
          skillCreated-in-0:
            consumer:
              autoBindDlq: true
              republishToDlq: true
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST}:5432/${POSTGRESQL_DATABASE}
    username: ${POSTGRESQL_USER}
    password: ${POSTGRESQL_PASSWORD}
  sql:
    init:
      mode: always