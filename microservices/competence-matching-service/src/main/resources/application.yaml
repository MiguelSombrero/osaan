api:
  version: 1.0.0
  title: Competence Matching Service API
  description: API for managing skill subscriptions and competence matching
  license:
    name: MIT
    url: https://raw.githubusercontent.com/MiguelSombrero/osaan/refs/heads/main/LICENSE?token=GHSAT0AAAAAADI246M5X7R6KOEGQGCQX3GY2HJDVBA
  contact:
    name: Miguel Sombrero
  security:
    oauth2:
      authorizationUrl: ${ISSUER_URI:https://keycloak.local/realms/osaan}/protocol/openid-connect/auth
      tokenUrl: ${ISSUER_URI:https://keycloak.local/realms/osaan}/protocol/openid-connect/token
      scopes:
        read: Grants read access
        write: Grants write access

logging:
  level:
    com.github.miguelsombrero.osaan: ${LOGGING_LEVEL_APPLICATION:INFO}

management:
  server.port: 4004
  endpoint.health.show-details: "ALWAYS"
  endpoints.web.exposure.include: "*"
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
  health.rabbit.enabled: true
  zipkin.tracing.endpoint: ${TRACING_ENDPOINT:http://zipkin-server:9411/api/v2/spans}
  tracing.sampling.probability: ${SAMPLING_PROBABILITY:1.0}

spring:
  application:
    name: competence-matching-service
  cloud:
    stream:
      bindings:
        skillCreated-in-0:
          destination: skill.created.queue
          group: competence-matching-service
      rabbit:
        bindings:
          skillCreated-in-0:
            consumer:
              autoBindDlq: true
              republishToDlq: true
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 10000        # 10s to get connection from pool
      validation-timeout: 5000         # 5s to validate connection
      max-lifetime: 600000             # 10min max connection lifetime
      idle-timeout: 300000             # 5min idle before eviction
      keepalive-time: 60000            # 60s TCP keepalive to detect stale connections
      minimum-idle: 2                  # Keep 2 connections ready
      maximum-pool-size: 10            # Max 10 connections
  sql:
    init:
      mode: always

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui.enabled: ${SWAGGER_UI_ENABLED:false}