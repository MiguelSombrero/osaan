API_DOCS_ENABLED: true
SWAGGER_UI_ENABLED: true
APP_AUTH_DISABLED: true

logging:
  level:
    com.github.miguelsombrero.osaan: TRACE
    org.springframework.jdbc: DEBUG
    web: INFO

management:
  server.port: 4003
  tracing.export.zipkin.enabled: false # Traces are collected in k3d only

server:
  port: 8094

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: osaan_pass # The Compose database, for local development only
  mail:
    host: localhost
    port: 1025
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest # Default RabbitMQ credentials for local development