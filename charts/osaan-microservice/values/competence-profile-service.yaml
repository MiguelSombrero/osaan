name: competence-profile-service
svcName: competence-profile-svc
image:
  repository: miguelsombrero/osaan-competence-profile-service
  tag: latest
rabbitmq:
  enabled: true
configMap:
  data:
    EMPLOYEE_SERVICE_URL: http://employee-svc:80
    SKILL_SERVICE_URL: http://skill-catalog-svc:80
    TRACING_ENDPOINT: http://jaeger.istio-system:9411/api/v2/spans
    LOGGING_LEVEL_APPLICATION: DEBUG
    ISSUER_URI: https://keycloak.local/realms/osaan
    JAVA_TOOL_OPTIONS: >-
      -Djavax.net.ssl.trustStore=/opt/java/keycloak-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit
