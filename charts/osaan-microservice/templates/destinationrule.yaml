{{- if .Values.istio.destinationRule.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "osaan-microservice.svcName" . }}-dr
  namespace: {{ .Values.namespace }}
spec:
  host: {{ include "osaan-microservice.svcName" . }}.{{ .Values.namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
{{- end }}
