name: osaan-ui
svcName: osaan-ui-svc
image:
  repository: miguelsombrero/osaan-ui
  tag: latest
port: 3000
probes:
  readiness:
    path: /api/health
    port: 3000
  liveness:
    path: /api/health
    port: 3000
appSecret:
  enabled: true
  secretName: osaan-ui-secret
redis:
  enabled: true
configMap:
  data:
    NODE_ENV: production
    NODE_TLS_REJECT_UNAUTHORIZED: "0"
    NEXT_PUBLIC_APP_URL: https://osaan.local:9443
    NEXTAUTH_URL: https://osaan.local:9443
    KEYCLOAK_ENABLED: "true"
    KEYCLOAK_ISSUER: https://keycloak.local/realms/osaan
    KEYCLOAK_CLIENT_ID: osaan-ui
    REDIS_ENABLED: "true"
    REDIS_HOST: valkey.osaan-dev.svc.cluster.local
    REDIS_PORT: "6379"
    SKILL_CATALOG_API_URL: http://skill-catalog-svc:80
    EMPLOYEE_API_URL: http://employee-svc:80
    COMPETENCE_PROFILE_API_URL: http://competence-profile-svc:80
    COMPETENCE_MATCHING_API_URL: http://competence-matching-svc:80
