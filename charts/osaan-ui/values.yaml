name: ""       # e.g. osaan-ui — used for deployment, configmap, pod label
svcName: ""    # e.g. osaan-ui-svc — kubernetes Service resource name
namespace: osaan-dev

image:
  repository: ""
  tag: latest
  pullPolicy: Always

replicas: 1
port: 3000

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

probes:
  readiness:
    path: /health
    port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /health
    port: 3000
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

prometheus:
  enabled: false
  port: "3001"
  scheme: http
  path: /metrics

appSecret:
  enabled: false
  secretName: ""

redis:
  enabled: false
  secretName: redis-secret

istio:
  destinationRule:
    enabled: false

configMap:
  data: {}
